name: Extract portal zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip to repo root
        run: |
          unzip -o montu-portal-homepage-images.zip -d /tmp/portal
          ls -la /tmp/portal
          if [ -f /tmp/portal/package.json ]; then
            cp -a /tmp/portal/. .
          else
            for d in /tmp/portal/*/; do
              if [ -f "$d/package.json" ]; then cp -a "$d". .; fi
            done
          fi
          rm -f montu-portal-homepage-images.zip .env
          rm -f .github/workflows/extract.yml
          git status --short
      - name: Commit extracted files
        run: |
          git config user.name "baruahmontu11-art"
          git config user.email "baruahmontu11@gmail.com"
          git add -A
          git status --short
          git commit -m "Homepage Images: admin gallery upload for Hero photo + Toolkit poster" || echo "nothing to commit"
          git push
